[package]
name = "bytifex-utils"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
tokio = { version = "1.54.1", features = ["sync"] }
or-die = "1.3.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
parking_lot = "0.13.0"

[dev-dependencies]
closure = "0.3.0"
fastrand = "2.5.0"
tokio = { version = "1.53.1", features = ["sync", "time", "macros", "rt", "rt-multi-thread"] }

[[bench]]
name = "object_pool"
harness = false
